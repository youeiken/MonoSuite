[env:m5stack-papermono-lite]
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DTIME_SYNC_TZ_OFFSET_HOURS=8

lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#0.2.21
    M5GFX = https://github.com/m5stack/M5GFX#0.2.28
    M5PM1 = https://github.com/m5stack/M5PM1#1.0.7
    M5IOE1 = https://github.com/m5stack/M5IOE1#1.0.9
    OpenFontRender = https://github.com/takkaO/OpenFontRender#a9acf5498ed058a034acaa1becbad790627b9ec1
    
extra_scripts = post:scripts/send_time.py
